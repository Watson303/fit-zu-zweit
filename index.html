<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fit zu zweit</title>
<meta name="description" content="Ernährungs- und Sportplan für Christoffer und Ariane">
<meta name="theme-color" content="#0A7FA6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fit zu zweit">
<style>
:root{
  --bg:#f6f3ee; --card:#ffffff; --ink:#1b2629; --muted:#56656a; --faint:#859196; --line:#e5dfd6; --soft:#efebe4;
  --C:#0A7FA6; --A:#D9583B; --ok:#2b8a57; --warn:#b97f00; --err:#c0392b;
  --me:var(--C); --me-soft:#e2f0f5; --C-soft:#e2f0f5; --A-soft:#fbe8e1;
  --shadow:0 1px 2px rgba(20,30,35,.05),0 6px 18px rgba(20,30,35,.06);
  --r:18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101416; --card:#1a2023; --ink:#e9eff1; --muted:#a6b2b6; --faint:#7b878b; --line:#2a3236; --soft:#22292c;
    --C:#0F8AA6; --A:#E2633F; --ok:#3aa56c; --warn:#d9a21b; --err:#e0645a;
    --me-soft:#14303a; --C-soft:#14303a; --A-soft:#3a231b; --shadow:none; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101416; --card:#1a2023; --ink:#e9eff1; --muted:#a6b2b6; --faint:#7b878b; --line:#2a3236; --soft:#22292c;
  --C:#0F8AA6; --A:#E2633F; --ok:#3aa56c; --warn:#d9a21b; --err:#e0645a;
  --me-soft:#14303a; --C-soft:#14303a; --A-soft:#3a231b; --shadow:none; color-scheme: dark;
}
body.p-A{ --me:var(--A); --me-soft:var(--A-soft); }
body.p-C{ --me:var(--C); --me-soft:var(--C-soft); }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:1.25rem;letter-spacing:-.01em}
h3{font-size:1.02rem}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.hidden{display:none!important}

/* Kopfzeile */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-weight:750;letter-spacing:-.01em}
.brand .logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--C),var(--A));display:grid;place-items:center;flex:none}
.brand .logo svg{width:18px;height:18px}
.who{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px 6px 7px;font-weight:600;font-size:.92rem}
.who .chip{width:20px;height:20px;border-radius:50%;background:var(--me);color:#fff;display:grid;place-items:center;font-size:.72rem;font-weight:800}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0}
.icon-btn svg{width:20px;height:20px}
.sync{width:40px;height:40px;border:0;background:transparent;display:grid;place-items:center;padding:0}
.sync i{width:11px;height:11px;border-radius:50%;background:var(--faint);box-shadow:0 0 0 3px color-mix(in srgb,var(--faint) 25%,transparent)}
.sync.ok i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.sync.busy i{background:var(--warn);animation:pulse 1s infinite}
.sync.err i{background:var(--err);box-shadow:0 0 0 3px color-mix(in srgb,var(--err) 25%,transparent)}
@keyframes pulse{50%{opacity:.35}}

main{max-width:600px;margin:0 auto;padding:14px 16px calc(150px + env(safe-area-inset-bottom))}
.stack>*+*{margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.tint{background:var(--me-soft);border-color:transparent}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.hello{padding:4px 2px 2px}
.hello h1{font-size:1.6rem;letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--me);color:#fff;min-height:48px;text-decoration:none}
.btn.block{width:100%}
.btn.big{min-height:60px;font-size:1.1rem;border-radius:18px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.danger{background:transparent;color:var(--err);border:1px solid color-mix(in srgb,var(--err) 40%,transparent)}
.btn.sm{min-height:38px;padding:8px 12px;border-radius:11px;font-size:.9rem}
.btn svg{width:20px;height:20px}
.btn:disabled{opacity:.5}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--soft);font-size:.8rem;font-weight:650;color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.me{background:var(--me-soft);color:var(--me)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.C{background:var(--C)} .dot.A{background:var(--A)}

/* Wasser */
.glasses{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.glass{width:30px;height:38px;border:2px solid color-mix(in srgb,var(--C) 55%,var(--line));border-top:0;border-radius:0 0 8px 8px;position:relative;overflow:hidden;background:transparent;padding:0}
.glass.full::after{content:"";position:absolute;inset:auto 0 0 0;height:78%;background:color-mix(in srgb,var(--C) 70%,#7fd3ea)}
.water-ctrl{display:flex;gap:10px;align-items:center;margin-top:10px}
.water-ctrl .btn{flex:1}
.round{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1.5rem;font-weight:700;display:grid;place-items:center;padding:0;flex:none}

/* Woche */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center}
.week .d{padding:7px 0 6px;border-radius:12px;font-size:.78rem;color:var(--muted);background:transparent}
.week .d.plan{background:var(--soft);color:var(--ink);font-weight:650}
.week .d.today{outline:2px solid var(--me);outline-offset:-2px}
.week .dots{display:flex;gap:3px;justify-content:center;height:9px;margin-top:4px}

/* Statistik */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--soft);border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:.74rem;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--me);border-radius:99px}

/* Listen */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.ex-n{width:28px;height:28px;border-radius:9px;background:var(--me-soft);color:var(--me);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none}
details.card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
details.card[open]>summary::after{transform:rotate(-135deg)}
.block-title{margin-top:14px;font-weight:700;font-size:.92rem;display:flex;gap:8px;align-items:center}
.block-title:first-child{margin-top:4px}
.note{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent);padding:10px 12px;border-radius:0 12px 12px 0;font-size:.9rem}

/* Kalender */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;margin-top:8px}
.cal .h{font-size:.72rem;color:var(--muted);font-weight:700;padding:4px 0}
.cal .c{aspect-ratio:1/1.05;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.85rem;gap:3px}
.cal .c.plan{background:var(--soft)}
.cal .c.today{outline:2px solid var(--me);outline-offset:-2px;font-weight:800}
.cal .c.out{visibility:hidden}
.cal .c .dots{display:flex;gap:3px;height:8px}
.cal .c .dot{width:8px;height:8px}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Essen */
.day{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);width:100%;text-align:left}
.day+.day{margin-top:8px}
.day.today{border:2px solid var(--me);background:var(--me-soft)}
.day .wd{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none}
.day.today .wd{background:var(--me);color:#fff}
.meal{display:grid;grid-template-columns:64px 1fr;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal b{font-variant-numeric:tabular-nums}
.ingr{margin:6px 0 0;padding-left:18px}
.ingr li{margin:3px 0}
.steps{list-style:none;padding:0;margin:8px 0 0;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:10px 0 10px 40px;border-top:1px solid var(--line)}
.steps li::before{content:counter(s);position:absolute;left:0;top:10px;width:28px;height:28px;border-radius:50%;background:var(--me-soft);color:var(--me);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.steps .btn{margin-top:8px}

/* Einkauf */
.shop-cat{margin-top:14px}
.shop-cat h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 4px 2px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;width:100%;text-align:left;min-height:56px}
.item+.item{margin-top:6px}
.item .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--faint);flex:none;display:grid;place-items:center}
.item.on .box{background:var(--ok);border-color:var(--ok)}
.item.on .box::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item.on .t{text-decoration:line-through;color:var(--faint)}
.item .q{margin-left:auto;font-size:.82rem;color:var(--muted);text-align:right;flex:none;max-width:42%}
.item .del{border:0;background:transparent;color:var(--faint);padding:4px 6px;font-size:1.1rem}
.add{display:flex;gap:8px;margin-top:10px}
.add input,.add select{min-height:48px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 10px;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-weight:650;font-size:.86rem;color:var(--muted)}
.chips button.on{background:var(--me);border-color:var(--me);color:#fff}
.day.pick{min-height:60px}
.ampel{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.ampel button{border:2px solid color-mix(in srgb,var(--rc) 35%,var(--line));background:var(--card);border-radius:14px;padding:8px 2px;font-size:.74rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.ampel button span{font-size:1.4rem;line-height:1.1}
.ampel button.on{background:var(--rc);border-color:var(--rc);color:#fff}
.rdot{width:22px;height:22px;border-radius:50%;color:#fff;font-size:.68rem;font-weight:800;display:inline-grid;place-items:center;flex:none;margin-left:-4px;border:2px solid var(--card)}
.stepper{display:flex;align-items:center;justify-content:center;gap:24px;margin:16px 0 4px;text-align:center}
li.tap{cursor:pointer;border-radius:10px}
li.tap:active{background:var(--soft)}
.macros{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:12px}
.mac{font-size:.82rem}
.mac .faint{font-weight:500}
.mac b{white-space:nowrap}
.mac .row{gap:6px}
.bar.thin{height:6px;margin-top:4px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chart .na{fill:var(--faint);font-size:12px}
.tbl-wrap{overflow-x:auto;margin-top:8px}
.tbl{width:100%;border-collapse:collapse;font-size:.84rem}
.tbl th{text-align:right;color:var(--muted);font-weight:650;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:nowrap}
.del-x{border:0;background:transparent;color:var(--faint);font-size:1rem;padding:6px 4px 6px 10px}

/* Formulare */
.field{display:block;margin-top:12px}
.field>span{display:block;font-size:.82rem;font-weight:650;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=url],input[type=number],input[type=date],input[type=time],input[type=password],select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;min-height:46px;outline:none}
input:focus,select:focus{border-color:var(--me);box-shadow:0 0 0 3px color-mix(in srgb,var(--me) 22%,transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.switch:first-of-type{border-top:0}
.switch input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked{background:var(--me)}
.switch input:checked::after{transform:translateX(20px)}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:.85rem;padding:0}
.daypick button.on{background:var(--me);color:#fff;border-color:var(--me)}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 13px;font-weight:650;font-size:.88rem;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* Diagramm */
.chart{position:relative;margin-top:10px}
.chart svg{width:100%;height:auto;display:block;touch-action:pan-y}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis text{fill:var(--faint);font-size:11px}
.chart .goal line{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 5}
.chart .goal text{fill:var(--muted);font-size:11px;font-weight:600}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;font-weight:650;padding:5px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-120%);opacity:0;transition:opacity .12s}
.chart .tip.on{opacity:1}
.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:.92rem}

/* Abzeichen */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.badge{border-radius:14px;padding:12px 6px 10px;text-align:center;background:var(--soft);border:1px solid transparent}
.badge .ic{font-size:1.7rem;line-height:1;filter:grayscale(1);opacity:.35}
.badge b{display:block;font-size:.78rem;margin-top:6px;line-height:1.2}
.badge span{display:block;font-size:.68rem;color:var(--muted);margin-top:3px;line-height:1.25}
.badge.got{background:var(--me-soft);border-color:color-mix(in srgb,var(--me) 30%,transparent)}
.badge.got .ic{filter:none;opacity:1}

/* Navigation */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.7rem;font-weight:650;color:var(--faint);border-radius:12px}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--me)}
.tabs button.on svg{transform:translateY(-1px)}

/* Küchentimer */
#timers{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));z-index:29;display:flex;flex-direction:column;gap:6px;padding:0 12px;pointer-events:none;max-width:600px;margin:0 auto}
.kt{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:14px;padding:9px 10px 9px 14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.kt b{font-variant-numeric:tabular-nums;font-size:1.1rem}
.kt .l{flex:1;min-width:0;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kt button{border:0;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);border-radius:10px;padding:7px 10px;font-weight:700;font-size:.82rem}
.kt.done{background:var(--A);color:#fff;animation:pulse 1s infinite}
.kt.done button{color:#fff}

/* Bottom-Sheet & Dialog */
.scrim{position:fixed;inset:0;background:rgba(10,15,18,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.scrim.center{align-items:center;padding:16px;z-index:70}
.dialog{background:var(--card);border-radius:20px;padding:20px;max-width:400px;width:100%;animation:up .18s ease-out}
.dialog .acts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
@keyframes fade{from{opacity:0}}

/* Toast */
#toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:650;font-size:.92rem;z-index:80;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Trainings-Player */
.player{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
.player .ptop{display:flex;align-items:center;gap:10px}
.player .pblock{flex:1;min-width:0;font-weight:700;font-size:.9rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .pprog{height:6px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:10px}
.player .pprog i{display:block;height:100%;background:var(--me);transition:width .3s}
.player .pmain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;min-height:0}
.player .kind{font-size:.8rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.player .pname{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;line-height:1.15;max-width:520px}
.player .pset{font-size:1rem;color:var(--muted);font-weight:650}
.ring{position:relative;width:min(62vw,270px);aspect-ratio:1;margin:8px 0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .bg{stroke:var(--soft)}
.ring .fg{stroke:var(--me);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .time{font-size:clamp(3rem,16vw,4.6rem);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.ring .sub{font-size:.95rem;color:var(--muted);font-weight:650;margin-top:4px}
.player.rest .ring .fg{stroke:var(--ok)} .player.rest .kind{color:var(--ok)}
.player.prep .ring .fg{stroke:var(--warn)} .player.prep .kind{color:var(--warn)}
.player.work .kind{color:var(--me)}
.player .phint{font-size:.98rem;color:var(--muted);max-width:480px;min-height:2.9em}
.player .pnext{font-size:.88rem;color:var(--faint)}
.player .pctrl{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:10px}
.player .pctrl .round{width:62px;height:62px}
.player .pctrl .round svg{width:26px;height:26px}
.player .pctrl .play{width:84px;height:84px;background:var(--me);border:0;color:#fff}
.player .pctrl .play svg{width:34px;height:34px}
.player .pdone{margin-top:12px}
.finish{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.finish .big{font-size:4rem;line-height:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.8}}

/* Wer bist du */
.whoami{display:grid;gap:12px;margin-top:14px}
.whoami button{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;border:2px solid var(--line);background:var(--card);text-align:left;font-weight:700;font-size:1.1rem}
.whoami .av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.2rem;flex:none}
@media (min-width:700px){ main{padding-top:20px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

const DB = {
  recs: LS.get('fz_recs', {}),
  dirty: new Set(LS.get('fz_dirty', [])),
  since: LS.get('fz_since', 0),
  cfg: LS.get('fz_cfg', { url:'https://script.google.com/macros/s/AKfycbzmSAAVsaCUtQpLl7IaQGDgwctQhlWOupALZOGokxCeWYah3iGlAduLOSAsnIRrEWAx/exec', code:'' }),
  lastSync: LS.get('fz_lastsync', 0)
};
function persist(){
  LS.set('fz_recs', DB.recs); LS.set('fz_dirty', [...DB.dirty]); LS.set('fz_since', DB.since); LS.set('fz_cfg', DB.cfg); LS.set('fz_lastsync', DB.lastSync);
}
function put(k, d, del){
  const r = { k, t: Date.now(), d };
  if (del) r.x = 1;
  DB.recs[k] = r; DB.dirty.add(k); persist(); scheduleSync();
}
function get(k){ const r = DB.recs[k]; return r && !r.x ? r.d : null; }
function list(prefix){ return Object.values(DB.recs).filter(r => !r.x && r.k.startsWith(prefix)); }

let syncTimer = null, syncing = false, syncAgain = false, syncState = 'off', syncMsg = '';
function scheduleSync(){ clearTimeout(syncTimer); syncTimer = setTimeout(sync, 1500); }
function setSync(state, msg){
  syncState = state; syncMsg = msg || '';
  const b = $('#syncBtn'); b.className = 'sync ' + (state === 'ok' ? 'ok' : state === 'busy' ? 'busy' : state === 'err' ? 'err' : '');
  b.title = { off:'Nicht verbunden – in den Einstellungen einrichten', ok:'Synchronisiert', busy:'Synchronisiere …', err:'Fehler: ' + syncMsg }[state] || '';
}
async function sync(manual){
  if (!DB.cfg.url || !DB.cfg.code){ setSync('off'); if (manual) openSettings(); return; }
  if (!navigator.onLine){ setSync('err', 'Offline'); return; }
  if (syncing){ syncAgain = true; return; }
  syncing = true; setSync('busy');
  const keys = [...DB.dirty];
  const sentT = {}; const records = [];
  keys.forEach(k => { const r = DB.recs[k]; if (r){ sentT[k] = r.t; records.push(r); } });
  try {
    const res = await fetch(DB.cfg.url, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ code: DB.cfg.code, since: DB.since, records }) });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'Unbekannter Fehler');
    keys.forEach(k => { if (DB.recs[k] && DB.recs[k].t === sentT[k]) DB.dirty.delete(k); });
    let changed = false;
    (j.records || []).forEach(r => {
      if (!r || !r.k) return;
      const l = DB.recs[r.k];
      if (!l || (r.t > l.t)){ DB.recs[r.k] = r; changed = true; }
    });
    DB.since = Math.max(0, (j.now || Date.now()) - 1);
    DB.lastSync = Date.now();
    persist(); setSync('ok');
    if (changed){ render(); checkBadges(); }
    if (manual) toast('Synchronisiert ✓');
  } catch (e){
    setSync('err', e.message || String(e));
    if (manual) toast('Abgleich fehlgeschlagen: ' + (e.message || e));
  } finally {
    syncing = false;
    if (syncAgain){ syncAgain = false; setTimeout(sync, 300); }
    if ($('#setSyncInfo')) $('#setSyncInfo').innerHTML = syncInfoHtml();
  }
}

   Auswertungen
   ========================================================= */
function trainWeek(){ const s = settings(); return Math.max(1, Math.floor(daysBetween(s.start, today()) / 7) + 1); }
function currentSets(){ const s = settings(); if (s.setsOverride) return s.setsOverride; return trainWeek() <= 2 ? 2 : 3; }
function isTrainDay(dateStr){ return settings().days.includes(parseYmd(dateStr).getDay()); }
function trainings(p){ return list('train|' + p + '|').map(r => r.d).sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.ts||0) - (b.ts||0)); }
function trainStats(p){
  const all = trainings(p);
  const dates = [...new Set(all.map(t => t.date))].sort();
  let best = 0, run = 0, prev = null;
  dates.forEach(d => { run = (prev && daysBetween(prev, d) <= 3) ? run + 1 : 1; best = Math.max(best, run); prev = d; });
  const cur = (prev && daysBetween(prev, today()) <= 3) ? run : 0;
  const minutes = all.reduce((s, t) => s + (t.min || 0), 0);
  return { count: all.length, dates, best, cur, last: prev, minutes };
}
function trainedOn(p, date){ return list('train|' + p + '|').some(r => r.d.date === date); }
function water(p, date){ return (get(`water|${p}|${date || today()}`) || {}).n || 0; }
function steps(p, date){ return (get(`steps|${p}|${date || today()}`) || {}).n || 0; }
function stepsAvg(p){ let s = 0, n = 0; for (let i = 0; i < 7; i++){ const v = steps(p, addDays(today(), -i)); if (v){ s += v; n++; } } return n ? Math.round(s / n) : 0; }
function biked(date){ return !!(get(`bike|A|${date || today()}`) || {}).on; }
function bikeSeason(){ const m = settings().bikeMode; if (m === 'on') return true; if (m === 'off') return false; const mo = new Date().getMonth() + 1; return mo >= 4 && mo <= 10; }
function bikeMonth(){ const ym = today().slice(0, 7); return list('bike|A|' + ym).filter(r => r.d.on).length; }
const skipCardioFor = p => p === 'A' && biked();
function bodyRows(p){ return list('body|' + p + '|').map(r => Object.assign({ k: r.k }, r.d)).sort((a,b) => a.date < b.date ? -1 : 1); }
function bodyStats(p){
  const s = settings(); const rows = bodyRows(p);
  const kg = rows.filter(r => r.kg > 0); const wa = rows.filter(r => r.waist > 0);
  const startKg = s.startKg[p], goal = s.goalKg[p];
  const cur = kg.length ? kg[kg.length-1].kg : startKg;
  const lost = startKg - cur;
  const pct = startKg > goal ? clamp(lost / (startKg - goal), 0, 1) : 0;
  const waistLost = wa.length >= 2 ? wa[0].waist - wa[wa.length-1].waist : 0;
  return { rows, kg, wa, startKg, goal, cur, lost, toGo: Math.max(0, cur - goal), pct, waistLost, waistCur: wa.length ? wa[wa.length-1].waist : null };
}

function badgeCtx(p){
  const s = settings();
  const tr = trainStats(p);
  const o = new Set(trainStats(other(p)).dates);
  return { tr, b: bodyStats(p), waterDays: list('water|' + p + '|').filter(r => (r.d.n || 0) >= s.waterGoal).length, team: tr.dates.filter(d => o.has(d)).length,
    diaryDays: new Set(list('food|' + p + '|').map(r => r.d.date)).size, stepDays: list('steps|' + p + '|').filter(r => (r.d.n || 0) > 0).length, bikeDays: list('bike|A|').filter(r => r.d.on).length };
}
const badgesFor = p => BADGES.filter(b => !b.only || b.only === p);
function earned(p){ const x = badgeCtx(p); return badgesFor(p).filter(b => { try { return b.ok(x); } catch(e){ return false; } }).map(b => b.id); }
function checkBadges(silent){
  const p = LS.get('fz_me', null); if (!p) return;
  const key = 'fz_seen_' + p; const seen = LS.get(key, null); const now = earned(p);
  if (seen === null || silent){ LS.set(key, now); return; }
  const fresh = now.filter(id => !seen.includes(id));
  if (fresh.length){
    LS.set(key, now);
    const b = BADGES.find(x => x.id === fresh[0]);
    confetti(); beep(988, .12); setTimeout(() => beep(1318, .18), 140);
    toast(`${b.ic} Neues Abzeichen: ${b.t}!` + (fresh.length > 1 ? ` (+${fresh.length-1})` : ''), 4000);
  }
}

let AC = null;
function unlockAudio(){ try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e){} }
function beep(freq = 880, dur = .12, vol = .25){
  if (!LOC.sound) return;
  try { unlockAudio(); if (!AC) return;
    const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + dur + .02);
  } catch(e){}
}
function vibrate(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }
let germanVoice = null;
function pickVoice(){ try { const v = speechSynthesis.getVoices(); germanVoice = v.find(x => /^de/i.test(x.lang)) || null; } catch(e){} }
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if (!LOC.voice || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'de-DE'; if (germanVoice) u.voice = germanVoice; u.rate = 1.02; speechSynthesis.speak(u); } catch(e){}
}
let wakeLockObj = null, wakeWanted = false;
async function wakeLock(on){
  wakeWanted = on;
  try {
    if (on && 'wakeLock' in navigator && !wakeLockObj){ wakeLockObj = await navigator.wakeLock.request('screen'); wakeLockObj.addEventListener('release', () => { wakeLockObj = null; }); }
    if (!on && wakeLockObj){ await wakeLockObj.release(); wakeLockObj = null; }
  } catch(e){}
}
async function notify(title, body){
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const reg = await navigator.serviceWorker?.getRegistration();
    if (reg) reg.showNotification(title, { body, icon:'icons/icon-192.png', badge:'icons/icon-192.png', vibrate:[300,150,300], tag:'fz-' + title });
    else new Notification(title, { body });
  } catch(e){}
}

function toast(msg, ms = 2400){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms); }
function confetti(){

/* --- Training --- */
function buildSteps(p, opt = {}){
  const sets = opt.sets || currentSets(); const full = sets >= 3; const spr = p === 'C' ? 3.5 : 3;
  const steps = [{ kind:'prep', mode:'time', sec:10, name:'Gleich geht’s los', hint: p === 'C' ? 'Bremsen fest, Bänder und Manschetten bereit, Wasser in Reichweite.' : 'Vibrationsplatte, Bänder und Matte bereitlegen.', block:'Start' }];
  for (const b of WORKOUTS[p]){
    if (b.optional && opt.skipOpt) continue;
    if (b.cardio && opt.skipCardio) continue;
    if (b.type === 'timed'){
      b.items.forEach(it => steps.push({ kind:'work', mode:'time', sec:it.sec, name:it.name, hint:it.hint, block:b.title }));
    } else if (b.type === 'interval'){
      const n = full ? b.rounds.full : b.rounds.base;
      steps.push({ kind:'prep', mode:'time', sec:b.prep, name:b.name, hint:b.hint, block:b.title });
      for (let i = 0; i < n; i++){
        steps.push({ kind:'work', mode:'time', sec:b.work, name:b.name, hint:b.hint, block:b.title, set:`Runde ${i+1} von ${n}` });
        if (i < n-1) steps.push({ kind:'rest', mode:'time', sec:b.rest, name:'Pause', block:b.title });
      }
    } else if (b.type === 'circuit'){
      const n = full ? b.rounds.full : b.rounds.base;
      steps.push({ kind:'prep', mode:'time', sec:b.prep, name:b.stations[0].name, hint:b.stations[0].hint, block:b.title });
      for (let r = 0; r < n; r++) b.stations.forEach((st, i) => {
        steps.push({ kind:'work', mode:'time', sec:b.work, name:st.name, hint:st.hint, block:b.title, set:`Runde ${r+1}/${n} · Station ${i+1}/${b.stations.length}` });
        if (!(r === n-1 && i === b.stations.length-1)) steps.push({ kind:'rest', mode:'time', sec:b.rest, name:'Kurz lockern', block:b.title });
      });
    } else if (b.type === 'reps'){
      const ns = b.fixedSets || sets;
      b.items.forEach(it => {
        steps.push({ kind:'prep', mode:'time', sec:b.prep, name:it.name, hint:it.hint, block:b.title, optional: !!b.optional });
        for (let s = 0; s < ns; s++){
          const lbl = `Satz ${s+1} von ${ns}`;
          if (it.sec){
            if (it.perSide){
              steps.push({ kind:'work', mode:'time', sec:it.sec, name:it.name + ' links', hint:it.hint, block:b.title, set:lbl, optional: !!b.optional });
              steps.push({ kind:'work', mode:'time', sec:it.sec, name:it.name + ' rechts', hint:it.hint, block:b.title, set:lbl, optional: !!b.optional });
            } else steps.push({ kind:'work', mode:'time', sec:it.sec, name:it.name, hint:it.hint, block:b.title, set:lbl, optional: !!b.optional });
          } else {
            const reps = it.perSide ? it.reps * 2 : it.reps;
            steps.push({ kind:'work', mode:'reps', reps:it.reps, perSide: !!it.perSide, sec: Math.round(reps * spr + 4), name:it.name, hint:it.hint, block:b.title, set:lbl, optional: !!b.optional });
          }
          if (s < ns-1) steps.push({ kind:'rest', mode:'time', sec:b.rest, name:'Pause', block:b.title, optional: !!b.optional });
        }
      });
    }
  }
  return steps;
}
const totalSec = steps => steps.reduce((s, x) => s + (x.sec || 0), 0);

    <button class="btn big block" data-act="startTraining">▶ Training starten</button>
    ${hasOpt ? `<button class="btn ghost block" style="margin-top:8px" data-act="startTraining" data-skip="1">Ohne Beinblock starten</button>` : ''}

    ${calendar()}
    <div class="legend"><span><i class="dot C"></i>Christoffer</span><span><i class="dot A"></i>Ariane</span><span class="faint">grau = Trainingstag</span></div>
    <div class="stats"><div class="stat"><b>${st.cur}</b><span>Serie jetzt</span></div><div class="stat"><b>${st.best}</b><span>beste Serie</span></div><div class="stat"><b>${st.count}</b><span>Trainings</span></div></div>
    <p class="tiny faint" style="margin:8px 0 0">Serie = Trainings in Folge ohne Pause über 3 Tage. ${esc(PEOPLE[other(p)].name)}: Serie ${ost.cur}, ${ost.count} Trainings.</p>
  </section>
  <details class="card" open><summary>Übungen im Überblick</summary>${blocks}${safety}</details>

function historyHtml(p){
  const t = trainings(p).slice(-8).reverse();
  if (!t.length) return '';
  return `<details class="card"><summary>Letzte Trainings</summary><ul class="list" style="margin-top:6px">${t.map(x => `<li><span class="ex-n">✓</span><div class="grow"><b>${WD[parseYmd(x.date).getDay()]}, ${fmtDate(x.date)}</b><div class="small muted">${x.min} Min. · ${x.sets} Sätze${x.skipOpt ? ' · ohne Beine' : ''}${x.skipCardio ? ' · Radtag' : ''}${x.partial ? ' · vorzeitig beendet' : ''}</div></div></li>`).join('')}</ul></details>`;

function calendar(){
  const t = today(); if (!CAL_M) CAL_M = t.slice(0, 7);
  const [y, m] = CAL_M.split('-').map(Number); const first = new Date(y, m-1, 1); const days = new Date(y, m, 0).getDate();
  const off = (first.getDay() + 6) % 7;
  let h = `<div class="muted small" style="margin-top:4px;font-weight:650">${MON[m-1]} ${y}</div><div class="cal">` + ['Mo','Di','Mi','Do','Fr','Sa','So'].map(d => `<div class="h">${d}</div>`).join('');
  for (let i = 0; i < off; i++) h += '<div class="c out"></div>';
  for (let d = 1; d <= days; d++){
    const ds = `${y}-${pad2(m)}-${pad2(d)}`;
    h += `<div class="c ${isTrainDay(ds) ? 'plan' : ''} ${ds === t ? 'today' : ''}"><span class="num">${d}</span><span class="dots">${trainedOn('C', ds) ? '<i class="dot C"></i>' : ''}${trainedOn('A', ds) ? '<i class="dot A"></i>' : ''}</span></div>`;
  }

}

/* --- Trainings-Player --- */
const PL = { steps: [], i: 0, endAt: 0, remainMs: 0, running: false, started: 0, timer: null, skipOpt: false, sets: 2, lastBeep: null, finished: false };
function startWorkout(skipOpt){
  unlockAudio();
  const p = me();
  PL.p = p; PL.sets = currentSets(); PL.skipOpt = !!skipOpt; PL.skipCardio = skipCardioFor(p); PL.steps = buildSteps(p, { sets: PL.sets, skipOpt, skipCardio: PL.skipCardio }); PL.started = Date.now(); PL.finished = false;
  $('#player').classList.remove('hidden'); document.body.classList.add('noscroll');
  wakeLock(true);
  clearInterval(PL.timer); PL.timer = setInterval(plTick, 200);
  goStep(0);
}
const stepTimed = s => s.mode === 'time' || (s.mode === 'reps' && LOC.handsfree);
function goStep(i){
  if (i < 0) i = 0;
  PL.i = i; const s = PL.steps[i];
  if (!s) return finishWorkout(false);
  PL.remainMs = s.sec * 1000; PL.endAt = Date.now() + PL.remainMs; PL.running = true; PL.lastBeep = null;
  if (s.kind === 'work'){ beep(880, .18); vibrate(120); }
  else if (s.kind === 'rest'){ beep(523, .2); vibrate([60,60,60]); }
  const nxt = nextWork(i);
  if (s.kind === 'work') say(s.mode === 'reps' ? `${s.name}. ${s.reps} Wiederholungen${s.perSide ? ' je Seite' : ''}.` : `${s.name}. ${s.sec >= 60 ? (s.sec/60) + (s.sec === 60 ? ' Minute' : ' Minuten') : s.sec + ' Sekunden'}.`);
  else if (s.kind === 'rest') say(`Pause. ${nxt ? 'Als Nächstes: ' + nxt.name : ''}`);
  else say(`${i === 0 ? 'Los geht’s gleich. ' : ''}Vorbereiten: ${s.name}.`);
  renderPlayer();
}
function nextWork(i){ for (let j = i+1; j < PL.steps.length; j++) if (PL.steps[j].kind === 'work') return PL.steps[j]; return null; }
function plTick(){
  if (PL.finished) return;
  const s = PL.steps[PL.i]; if (!s || !PL.running || !stepTimed(s)) return;
  const ms = PL.endAt - Date.now(); const rem = Math.max(0, Math.ceil(ms / 1000));
  if (rem <= 3 && rem > 0 && PL.lastBeep !== rem){ PL.lastBeep = rem; beep(660, .08); }
  updatePlayerTime(ms);
  if (ms <= 0) goStep(PL.i + 1);
}
function updatePlayerTime(ms){
  const s = PL.steps[PL.i]; if (!s) return;
  const el = $('#plTime'); const fg = $('#plRing');
  if (!el) return;
  if (!stepTimed(s)){ el.textContent = s.reps; return; }
  const left = ms != null ? ms : PL.remainMs;
  el.textContent = fmtClock(Math.max(0, Math.ceil(left / 1000)));
  if (fg){ const C = 2 * Math.PI * 88; fg.style.strokeDashoffset = String(C * (1 - clamp(left / (s.sec * 1000), 0, 1))); }
}

function diceWeek(){
  const prev = weekPlan(addDays(PLAN.mon, -7)) || {};
  const prevIds = new Set(Object.values(prev));
  const pool = RCP.map(x => RECIPES[x[0]]).filter(r => r.id !== 'frei' && r.id !== 'reste' && !isBlocked(r));
  const groups = ['Nudeln','Hähnchen','Pute & Rind','Fisch','Vegetarisch','Abendbrot'];
  for (let attempt = 0; attempt < 60; attempt++){
    const score = r => Math.random() + (isFav(r) ? .45 : 0) + (ratingsOf(r.id).includes(2) ? .2 : 0) - (prevIds.has(r.id) ? 1 : 0);
    const shuffled = pool.map(r => [score(r), r]).sort((a, b) => b[0] - a[0]).map(x => x[1]);
    const pick = [], cnt = {}; let ofen = 0;
    for (const r of shuffled){
      if (pick.length === 6) break;
      if (groups.some(g => r.tags.includes(g) && (cnt[g] || 0) >= 2)) continue;
      if (r.tags.includes('Ofen') && ofen >= 3) continue;
      pick.push(r); groups.forEach(g => { if (r.tags.includes(g)) cnt[g] = (cnt[g] || 0) + 1; }); if (r.tags.includes('Ofen')) ofen++;
    }
    if (pick.length === 6 && (cnt['Fisch'] || 0) >= 1){
      pick.sort(() => Math.random() - .5);
      [1,2,3,4,5,6].forEach((wd, i) => { PLAN.days[wd] = pick[i].id; });
      return;
    }
  }
}

function recentFoods(p){

/* --- Nährwerte: Fett, Kohlenhydrate, Zucker --- */
const MACROS = [
  { k:'kcal', t:'Kalorien', u:'kcal', max:true },
  { k:'prot', t:'Eiweiß', u:'g', max:false },
  { k:'fat', t:'Fett', u:'g', max:true },
  { k:'carb', t:'Kohlenhydrate', s:'Kohlenhydr.', u:'g', max:true },
  { k:'sugar', t:'Zucker', u:'g', max:true }
];
/* Richtwerte: Fett ca. 30 %, Kohlenhydrate ca. 45 % der kcal, Zucker höchstens 10 % (WHO) */
function macroGoals(p, date){
  const k = goalKcal(p, date);
  return { kcal: k, prot: PEOPLE[p].protein, fat: Math.round(k * .30 / 9), carb: Math.round(k * .45 / 4), sugar: Math.round(k * .10 / 4) };
}
function entryMacros(e){
  if (e.fat != null) return { kcal: e.kcal || 0, prot: e.prot || 0, fat: e.fat || 0, carb: e.carb || 0, sugar: e.sugar || 0 };
  const out = { kcal: e.kcal || 0, prot: e.prot || 0, fat: 0, carb: 0, sugar: 0 };
  let ref = null;
  if (e.fid){ const f = foodById(e.fid); if (f) ref = foodPortion(f, 1); }
  else if (e.src && RECIPES[e.src]) ref = personNutr(RECIPES[e.src], e.p || me());
  if (ref && ref.kcal){ const r = (e.kcal || 0) / ref.kcal; out.fat = ref.fat * r; out.carb = ref.carb * r; out.sugar = ref.sugar * r; }
  return out;
}
function dayMacros(p, date){
  const e = foodEntries(p, date), t = { kcal: 0, prot: 0, fat: 0, carb: 0, sugar: 0, n: e.length };
  e.forEach(x => { const m = entryMacros(x); MACROS.forEach(({ k }) => { t[k] += m[k]; }); });
  return t;
}
function macroLine(p, date){
  const m = dayMacros(p, date), g = macroGoals(p, date);
  return `<div class="macros">${MACROS.slice(1).map(x => { const pct = g[x.k] ? m[x.k] / g[x.k] : 0; const over = x.max && pct > 1.05;
    return `<div class="mac"><div class="row between"><span>${x.s || x.t}</span><b class="num">${fmtNum(m[x.k], 0)}<span class="faint">/${g[x.k]} g</span></b></div><div class="bar thin"><i style="width:${Math.min(pct, 1) * 100}%;${over ? 'background:var(--warn)' : ''}"></i></div></div>`; }).join('')}</div>`;
}

let DIARY_MODE = 'tag', WEEK_MON = null, WEEK_METRIC = 'kcal';

  const logged = rows.filter(r => r.m.n > 0);
  const avg = k => logged.length ? logged.reduce((s, r) => s + r.m[k], 0) / logged.length : 0;
  const avgGoal = k => logged.length ? logged.reduce((s, r) => s + r.g[k], 0) / logged.length : macroGoals(p, t)[k];
  const inGoal = logged.filter(r => r.m.kcal <= r.g.kcal * 1.05 && r.m.kcal >= r.g.kcal * .6).length;
  const maxR = logged.slice().sort((a, b) => b.m.kcal - a.m.kcal)[0], minR = logged.slice().sort((a, b) => a.m.kcal - b.m.kcal)[0];

  return `

    ${logged.length ? `<p class="small muted" style="margin:10px 0 0">Am meisten: <b>${dl(maxR.d)}</b> (${fmtNum(maxR.m.kcal, 0)} kcal) · am wenigsten: <b>${dl(minR.d)}</b> (${fmtNum(minR.m.kcal, 0)} kcal)</p>` : '<p class="small muted" style="margin:10px 0 0">In dieser Woche ist noch nichts eingetragen.</p>'}
  </section>
  <section class="card">
    <div class="chips" style="margin-top:0">${MACROS.map(x => `<button class="${WEEK_METRIC === x.k ? 'on' : ''}" data-act="weekMetric" data-m="${x.k}">${x.t}</button>`).join('')}</div>

let WC = null;
function weekChart(rows, M){
  const W = 340, H = 200, L = 40, R = 10, T = 14, B = 26;
  const vals = rows.map(r => r.m[M.k]), goals = rows.map(r => r.g[M.k]);
  let top = Math.max(...vals, ...goals) * 1.12 || 1;
  const step = top > 2000 ? 500 : top > 800 ? 250 : top > 200 ? 50 : top > 80 ? 20 : 10;
  top = Math.ceil(top / step) * step;
  const Y = v => T + (1 - v / top) * (H - T - B);
  const bw = (W - L - R) / 7, barW = Math.min(30, bw * .62);
  let grid = '', ax = '', bars = '', hits = '';
  for (let v = 0; v <= top; v += step){ grid += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/>`; ax += `<text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmtNum(v, 0)}</text>`; }
  const goalAvg = goals.reduce((s, g) => s + g, 0) / 7;
  WC = { W, H, items: [] };
  rows.forEach((r, i) => {
    const cx = L + bw * i + bw / 2, v = vals[i], g = goals[i], over = M.max && v > g * 1.05;
    ax += `<text x="${cx}" y="${H-8}" text-anchor="middle" ${r.d === today() ? 'style="font-weight:800;fill:var(--ink)"' : ''}>${WD[parseYmd(r.d).getDay()]}</text>`;
    if (r.m.n){
      const y = Y(v), h = Math.max(2, (H - B) - y), rr = Math.min(4, barW / 2, h);
      bars += `<path d="M${cx - barW/2},${H-B} V${y + rr} Q${cx - barW/2},${y} ${cx - barW/2 + rr},${y} H${cx + barW/2 - rr} Q${cx + barW/2},${y} ${cx + barW/2},${y + rr} V${H-B} Z" fill="${over ? 'var(--warn)' : 'var(--me)'}"/>`;
    } else if (!r.future) bars += `<text x="${cx}" y="${H-B-6}" text-anchor="middle" class="na">–</text>`;
    WC.items.push({ x: cx, y: r.m.n ? Y(v) : H - B, label: r.m.n ? `${WD[parseYmd(r.d).getDay()]} ${fmtDate(r.d)} · ${fmtNum(v, 0)} ${M.u} (${M.max ? 'Richtwert' : 'Ziel'} ${fmtNum(g, 0)})` : `${WD[parseYmd(r.d).getDay()]} ${fmtDate(r.d)} · nichts eingetragen` });
  });
  const gy = Y(goalAvg);
  return `<div class="chart" id="wchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${M.t} pro Tag"><g class="grid">${grid}</g><g class="axis">${ax}</g>${bars}
    <g class="goal"><line x1="${L}" x2="${W-R}" y1="${gy}" y2="${gy}"/></g>
    <rect id="wHi" x="0" y="${T}" width="${bw}" height="${H-T-B}" fill="var(--ink)" opacity="0"/></svg><div class="tip" id="wTip"></div></div>`;
}
function bindWeekChart(){
  const c = $('#wchart'); if (!c || !WC) return;
  const svg = c.querySelector('svg'), tip = $('#wTip'), hi = $('#wHi');
  const bw = (WC.W - 50) / 7;
  const show = e => {
    const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) / r.width * WC.W;
    let best = WC.items[0]; WC.items.forEach(q => { if (Math.abs(q.x - sx) < Math.abs(best.x - sx)) best = q; });
    hi.setAttribute('x', best.x - bw / 2); hi.setAttribute('width', bw); hi.setAttribute('opacity', '.05');
    tip.textContent = best.label; tip.style.left = clamp(best.x / WC.W * r.width, 90, r.width - 90) + 'px'; tip.style.top = (best.y / WC.H * r.height) + 'px'; tip.classList.add('on');
  };
  const hide = () => { tip.classList.remove('on'); hi.setAttribute('opacity', '0'); };
  svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show); svg.addEventListener('pointerleave', hide);
}

let CH = null;
function chartHtml(pts, goal, unit, p){

  ax += `<text x="${L}" y="${H-6}">${fmtDate(ymd(new Date(x0)))}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${fmtDate(ymd(new Date(x1)))}</text>`;

  const dots = pts.map((q, i) => `<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(q.v).toFixed(1)}" r="4.5" fill="${color}" stroke="var(--card)" stroke-width="2"/>`).join('');
  CH = { pts: pts.map((q, i) => ({ x: X(xs[i]), y: Y(q.v), label: `${fmtDate(q.date)} · ${fmtNum(q.v)} ${unit}${q.start ? ' (Start)' : ''}` })), W, H, T, B };
  return `<div class="chart" id="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${unit === 'kg' ? 'Gewichtsverlauf' : 'Bauchumfang'}"><g class="grid">${grid}</g><g class="axis">${ax}</g>${goalEl}
    <line id="chX" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--faint)" stroke-width="1" opacity="0"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg><div class="tip" id="chTip"></div></div>
    ${pts.length === 1 && pts[0].start ? '<p class="small muted" style="margin:6px 0 0">Startwert – trag einmal pro Woche dein Gewicht ein, am besten morgens.</p>' : ''}`;
}

function gcalLink(){
  const s = settings(); const first = nextTrainDate(); const [hh, mm] = s.time.split(':').map(Number);
  const d = parseYmd(first); d.setHours(hh, mm, 0, 0); const e = new Date(d.getTime() + 45*60000);
  const f = x => `${x.getFullYear()}${pad2(x.getMonth()+1)}${pad2(x.getDate())}T${pad2(x.getHours())}${pad2(x.getMinutes())}00`;
  const days = s.days.map(n => ['SU','MO','TU','WE','TH','FR','SA'][n]).join(',');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent('Training – Fit zu zweit') +
    '&dates=' + f(d) + '/' + f(e) + '&ctz=Europe/Berlin&recur=' + encodeURIComponent('RRULE:FREQ=WEEKLY;BYDAY=' + days) +
    '&details=' + encodeURIComponent('35–45 Minuten Abendtraining. App öffnen und auf „Training starten“ tippen.');
}
function nextTrainDate(){ const t = today(); for (let i = 0; i < 8; i++){ const d = addDays(t, i); if (isTrainDay(d)) return d; } return t; }
function download(name, text, type){
  const blob = new Blob([text], { type }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function icsTrain(){
  const s = settings(); const d = nextTrainDate().replace(/-/g, ''); const tm = s.time.replace(':', '') + '00';
  const days = s.days.map(n => ['SU','MO','TU','WE','TH','FR','SA'][n]).join(',');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  download('training-fit-zu-zweit.ics', ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Fit zu zweit//DE','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:training-' + uid() + '@fitzuzweit','DTSTAMP:' + stamp,'DTSTART:' + d + 'T' + tm,'DURATION:PT45M','RRULE:FREQ=WEEKLY;BYDAY=' + days,
    'SUMMARY:Training – Fit zu zweit','DESCRIPTION:35–45 Minuten Abendtraining. App öffnen und Training starten.',
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Gleich ist Training','TRIGGER:-PT15M','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n'), 'text/calendar');
}
function icsWater(){
  const d = today().replace(/-/g, ''); const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  const ev = ['100000','130000','160000'].map(h => ['BEGIN:VEVENT','UID:wasser-' + h + '-' + uid() + '@fitzuzweit','DTSTAMP:' + stamp,'DTSTART:' + d + 'T' + h,'DURATION:PT5M','RRULE:FREQ=DAILY',
    'SUMMARY:💧 Glas Wasser trinken','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Glas Wasser trinken','TRIGGER:PT0M','END:VALARM','END:VEVENT'].join('\r\n'));
  download('trinken-fit-zu-zweit.ics', ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Fit zu zweit//DE'].concat(ev, ['END:VCALENDAR']).join('\r\n'), 'text/calendar');
}
function exportData(){ download(`fit-zu-zweit-sicherung-${today()}.json`, JSON.stringify({ app:'fit-zu-zweit', v:1, recs: DB.recs }, null, 1), 'application/json'); }
function importData(e){
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const j = JSON.parse(r.result); if (!j.recs) throw 0; let n = 0;
      Object.values(j.recs).forEach(x => { const l = DB.recs[x.k]; if (!l || x.t > l.t){ DB.recs[x.k] = x; DB.dirty.add(x.k); n++; } });
      persist(); scheduleSync(); render(); toast(`${n} Einträge übernommen`); } catch(err){ toast('Datei konnte nicht gelesen werden'); } };
  r.readAsText(f);
}
function shareLink(){
  const data = btoa(unescape(encodeURIComponent(JSON.stringify({ u: DB.cfg.url, c: DB.cfg.code }))));
  const url = location.origin + location.pathname + '#verbinden=' + data;
  const text = `Hier ist unser Link für „Fit zu zweit“. Einmal öffnen, dann bist du verbunden: ${url}`;
  if (navigator.share) navigator.share({ title:'Fit zu zweit', text, url }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('Link kopiert – jetzt per WhatsApp schicken')).catch(() => prompt('Link kopieren:', url));
}

  icsTrain: () => icsTrain(),
  icsWater: () => icsWater(),
  notifPerm: async () => { if (!('Notification' in window)) return toast('Dieses Gerät unterstützt keine Benachrichtigungen'); const r = await Notification.requestPermission(); toast(r === 'granted' ? 'Benachrichtigungen erlaubt ✓' : 'Nicht erlaubt – geht in den Handy-Einstellungen'); },
  exportData: () => exportData(),
  stepsSave: () => { const v = parseInt(String($('#stepsIn').value).replace(/[^0-9]/g, ''), 10);
    if (!(v >= 0) || v > 100000) return toast('Bitte die Schritte als Zahl eingeben');
    const p = me(), t = today(); put(`steps|${p}|${t}`, { p, date: t, n: v }); render(); toast(`👣 ${fmtNum(v, 0)} Schritte gespeichert`); setTimeout(checkBadges, 300); },
  bikeToggle: () => { const t = today(); const on = !biked(t); put(`bike|A|${t}`, { date: t, on }); render();
    if (on){ toast('🚲 Stark! Radtag eingetragen'); vibrate(30); } setTimeout(checkBadges, 300); }
};
function addWater(d){
  const p = me(), t = today(); const n = Math.max(0, water(p, t) + d);
  put(`water|${p}|${t}`, { p, date: t, n });
  if (d > 0){ vibrate(20); if (n === settings().waterGoal){ toast('💧 Wasserziel geschafft!'); confetti(); } else toast(`💧 ${n} ${n === 1 ? 'Glas' : 'Gläser'} heute`); }
  render(); setTimeout(checkBadges, 300);
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn){ e.preventDefault(); fn(el, e); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.item[data-act]')){ e.preventDefault(); ACT.shopToggle(e.target, e); }
  if (e.key === 'Enter' && e.target.id === 'shopName') ACT.shopAdd();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('li.tap[data-act]')){ e.preventDefault(); openFoodEdit(e.target.dataset.k); }
  if (e.key === 'Enter' && e.target.id === 'stepsIn') ACT.stepsSave();
});
document.addEventListener('input', e => {
  if (e.target.id === 'planQ' && PLAN){ PLAN.q = e.target.value; renderPlanList(); }
  if (e.target.id === 'foodQ' && FOOD){ FOOD.q = e.target.value; renderFoodList(); }
  if (e.target.id === 'foodG' && FOOD){ FOOD.grams = e.target.value; const c = foodCalc(); if (c){ const n = foodPortion(c.f, c.mult); $('#foodK').textContent = fmtNum(n.kcal, 0) + ' kcal'; $('#foodP').textContent = fmtNum(n.prot, 0) + ' g Eiweiß'; } }
  if (['mfK','mfP','mfG','mfF','mfC','mfS'].includes(e.target.id)) mfPreview();
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.loc;
  if (k){ LOC[k] = e.target.checked; saveLoc(); render(); }
  if (['setTime','setStart','setSets','setBike'].includes(e.target.id)) ACT.saveGoals();
  if (e.target.id === 'foodDate' && FOOD) FOOD.date = e.target.value;
  if (e.target.id === 'mfType'){ const t = PORTION_TYPES[+e.target.value]; $('#mfG').value = t[1]; mfPreview(); }
});

/* =========================================================
   Start, Schnellstarts, Verbindungs-Link
   ========================================================= */
function handleAction(){
  const a = new URLSearchParams(location.search).get('a');
  if (!a || !LS.get('fz_me', null)) return;
  history.replaceState(null, '', location.pathname + location.hash);
  if (a === 'training'){ setView('training'); }
  else if (a === 'wasser'){ setView('heute'); addWater(1); }
  else if (a === 'gewicht'){ setView('fortschritt'); openWeight(); }
  else if (a === 'einkauf'){ setView('einkauf'); }
  else if (a === 'essen'){ setView('essen'); }
}
function handleConnectHash(){
  const m = location.hash.match(/verbinden=([^&]+)/);
  if (!m) return;
  try { const j = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))); if (j.u && j.c){ DB.cfg = { url: j.u, code: j.c }; DB.since = 0; Object.keys(DB.recs).forEach(k => DB.dirty.add(k)); persist(); toast('Verbunden mit eurer Google-Tabelle ✓'); } } catch(e){ toast('Link ungültig'); }
  history.replaceState(null, '', location.pathname + location.search);
}
function init(){
  handleConnectHash();
  VIEW = LS.get('fz_view', 'heute');
  render(); renderTimers(); if (KT.length) ktLoop();
  setSync(DB.cfg.url ? 'ok' : 'off');
  if (!LS.get('fz_me', null)) chooseMe(true); else { checkBadges(); handleAction(); }
  sync();
  setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 60000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible'){ sync(); if (wakeWanted) wakeLock(true); if (!$('#player').classList.contains('hidden')) plTick(); render(); }
  });
  window.addEventListener('online', () => sync());
  let lastDay = today(); setInterval(() => { if (today() !== lastDay){ lastDay = today(); render(); } }, 60000);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
init();
</script>
